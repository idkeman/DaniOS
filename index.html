<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>DaniOS — Web Desktop</title>
<style>
:root{font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#f8fafc;background:#101827;font-synthesis:none}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea{font:inherit}.desktop{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 45%,#176c9c 0,#123c69 30%,transparent 57%),radial-gradient(ellipse at 25% 80%,#443c91 0,transparent 48%),linear-gradient(135deg,#071526,#102e4b 55%,#071525)}.desktop:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 35%,#ffffff08 35.2%,transparent 35.6%),radial-gradient(ellipse at center,transparent 30%,#02061766 100%);pointer-events:none}.desktop-icons{position:absolute;top:18px;left:14px;display:grid;grid-auto-flow:row;grid-template-columns:82px;gap:10px}.desk-icon{width:76px;min-height:78px;border:1px solid transparent;border-radius:7px;background:transparent;color:white;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:default;font-size:12px}.desk-icon:hover,.desk-icon:focus{background:#ffffff20;border-color:#ffffff22}.desk-icon .glyph{font-size:30px;filter:drop-shadow(0 2px 2px #0005)}.taskbar{position:absolute;z-index:10000;bottom:0;left:0;right:0;height:54px;background:#111c2bdc;backdrop-filter:blur(24px);border-top:1px solid #ffffff24;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}.task-left{position:absolute;left:16px;font-size:12px;color:#dbeafe}.task-apps{display:flex;align-items:center;gap:5px}.task-btn{height:42px;min-width:42px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:white;font-size:21px;cursor:pointer;position:relative}.task-btn:hover,.task-btn.active{background:#ffffff20}.task-btn.running:after{content:"";position:absolute;bottom:2px;left:35%;width:30%;height:3px;border-radius:3px;background:#60a5fa}.tray{position:absolute;right:14px;display:flex;align-items:center;gap:13px;font-size:12px}.start-panel,.quick-panel{position:absolute;z-index:9999;bottom:62px;background:#172333eF;backdrop-filter:blur(28px);border:1px solid #ffffff25;box-shadow:0 18px 60px #0008;border-radius:12px;color:white}.start-panel{width:min(620px,calc(100vw - 24px));left:50%;transform:translateX(-50%);padding:22px}.start-search{width:100%;padding:12px 15px;border-radius:7px;border:1px solid #7dd3fc66;background:#0c1725;color:white;outline:none}.start-heading{font-size:13px;font-weight:600;margin:22px 0 12px}.app-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.app-tile{border:0;background:transparent;color:white;border-radius:8px;padding:12px 4px;cursor:pointer;font-size:12px}.app-tile:hover{background:#ffffff18}.app-tile b{display:block;font-size:27px;margin-bottom:6px;font-weight:400}.start-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff20;margin:20px -22px -22px;padding:14px 22px}.window{position:absolute;z-index:10;left:15%;top:10%;width:min(760px,85vw);height:min(520px,75vh);min-width:300px;min-height:220px;background:#f5f7fb;color:#172033;border:1px solid #ffffff55;border-radius:10px;box-shadow:0 20px 70px #0008;overflow:hidden;display:flex;flex-direction:column}.window.focused{z-index:100}.titlebar{height:42px;flex-shrink:0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;padding-left:14px;user-select:none;cursor:move;border-bottom:1px solid #dbe1e9}.window-title{font-size:13px;display:flex;align-items:center;gap:9px}.win-controls{display:flex;height:100%}.win-controls button{width:44px;border:0;background:transparent;color:#334155;cursor:pointer}.win-controls button:hover{background:#e2e8f0}.win-controls .close:hover{background:#dc2626;color:white}.window-body{flex:1;overflow:auto;background:#fff}.explorer-toolbar{height:48px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 14px;gap:9px}.explorer-toolbar button,.soft-btn{border:0;background:#eef2f7;border-radius:5px;padding:7px 10px;cursor:pointer}.path{flex:1;background:#f1f5f9;border-radius:5px;padding:8px 12px;font-size:12px;color:#475569}.file-layout{display:flex;height:calc(100% - 48px)}.file-side{width:175px;border-right:1px solid #e5e7eb;padding:12px;font-size:13px;color:#475569}.file-side div{padding:8px;border-radius:5px}.file-side div:hover{background:#eff6ff}.file-items{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));align-content:start;gap:12px;flex:1}.file-item{text-align:center;padding:12px 5px;border-radius:6px;font-size:12px;cursor:pointer}.file-item:hover{background:#eff6ff}.file-item span{display:block;font-size:30px;margin-bottom:7px}.notepad{width:100%;height:100%;border:0;resize:none;outline:0;padding:16px;font:14px/1.6 Consolas,monospace;color:#1e293b}.settings{display:flex;height:100%;background:#f8fafc}.settings-nav{width:190px;padding:20px;background:#f1f5f9}.settings-nav button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:6px;background:transparent;color:#334155;cursor:pointer}.settings-nav button:hover{background:#e2e8f0}.settings-content{padding:26px;flex:1;overflow:auto}.settings-content h2{font-weight:500}.setting-card{padding:16px;border:1px solid #e2e8f0;border-radius:8px;margin:12px 0}.calc{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc input{grid-column:span 4;text-align:right;padding:15px;font-size:25px;border:1px solid #cbd5e1;border-radius:7px}.calc button{padding:16px;border:0;border-radius:6px;background:#e8edf4;cursor:pointer}.browser{height:100%;display:flex;flex-direction:column}.browser-bar{padding:9px;display:flex;gap:7px;background:#eef2f7}.browser-bar input{flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:5px}.browser iframe{flex:1;border:0;width:100%}.terminal{height:100%;background:#0b1220;color:#d1fae5;padding:15px;font:13px/1.7 Consolas,monospace;overflow:auto}.terminal input{background:transparent;border:0;outline:0;color:white;font:inherit;width:80%}.context{position:absolute;z-index:20000;min-width:190px;background:#172333f2;border:1px solid #ffffff25;border-radius:8px;padding:5px;box-shadow:0 12px 40px #0008}.context button{display:block;width:100%;padding:9px 12px;text-align:left;color:white;background:transparent;border:0;border-radius:5px;font-size:13px;cursor:pointer}.context button:hover{background:#ffffff20}.toast{position:absolute;right:18px;bottom:70px;background:#172333ed;color:white;padding:12px 16px;border-radius:8px;z-index:30000;box-shadow:0 8px 30px #0006;font-size:13px}@media(max-width:600px){.task-left{display:none}.app-grid{grid-template-columns:repeat(3,1fr)}.window{left:3%!important;top:4%!important;width:94vw!important;height:85vh!important}.file-side{width:115px}.tray{gap:6px}.desktop-icons{grid-template-columns:70px}.desk-icon{width:65px}}
</style></head>
<body><main class="desktop" id="desktop">
<div class="desktop-icons" id="desktopIcons">
<button class="desk-icon" data-app="explorer"><span class="glyph">📁</span>This PC</button>
<button class="desk-icon" data-app="browser"><span class="glyph">🌐</span>Browser</button>
<button class="desk-icon" data-app="notepad"><span class="glyph">📝</span>Notepad</button>
<button class="desk-icon" data-app="recycle"><span class="glyph">🗑️</span>Recycle Bin</button>
</div>
<div class="taskbar"><div class="task-left">☁  22°C &nbsp; Mostly clear</div><div class="task-apps"><button class="task-btn" id="startBtn" title="Start">⊞</button><button class="task-btn" data-app="search" title="Search">⌕</button><button class="task-btn" data-app="explorer" title="File Explorer">📁</button><button class="task-btn" data-app="browser" title="Browser">🌐</button><button class="task-btn" data-app="notepad" title="Notepad">📝</button><button class="task-btn" data-app="settings" title="Settings">⚙️</button></div><div class="tray"><span>⌃</span><span>◉</span><span>🔊</span><span>▣</span><span id="clock"></span></div></div>
<div class="start-panel" id="startPanel" hidden><input class="start-search" id="startSearch" placeholder="Search for apps, settings, and documents"><div class="start-heading">Pinned</div><div class="app-grid" id="appGrid"></div><div class="start-footer"><span>👤 DaniOS User</span><button class="soft-btn" id="powerBtn">⏻ Power</button></div></div>
</main>
<script>
const $=s=>document.querySelector(s), desktop=$('#desktop');let z=20,winId=0,activeApp=null;
const apps=[['explorer','📁','File Explorer'],['browser','🌐','Browser'],['notepad','📝','Notepad'],['calculator','🧮','Calculator'],['settings','⚙️','Settings'],['terminal','⌨️','Terminal']];
const files=[['📁','Documents'],['📁','Downloads'],['📁','Pictures'],['📁','Music'],['📁','Videos'],['💽','Local Disk (C:)']];
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;desktop.append(t);setTimeout(()=>t.remove(),2400)}
function showStart(){let p=$('#startPanel');p.hidden=!p.hidden;if(!p.hidden)$('#startSearch').focus()}
$('#appGrid').innerHTML=apps.map(a=>'<button class="app-tile" data-app="'+a[0]+'"><b>'+a[1]+'</b>'+a[2]+'</button>').join('');
function appContent(id){if(id==='explorer')return '<div class="explorer-toolbar"><button>←</button><button>→</button><button>↑</button><div class="path">This PC</div><button onclick="toast(\'New folder created\')">＋ New</button></div><div class="file-layout"><aside class="file-side"><div>🏠 Home</div><div>🖥 This PC</div><div>📄 Documents</div><div>⬇ Downloads</div><div>🖼 Pictures</div><div>☁ OneDrive</div></aside><div class="file-items">'+files.map(f=>'<div class="file-item" ondblclick="toast(\''+f[1]+' opened\')"><span>'+f[0]+'</span>'+f[1]+'</div>').join('')+'</div></div>';
if(id==='notepad')return '<textarea class="notepad" placeholder="Start typing..."></textarea>';
if(id==='calculator')return '<div class="calc"><input id="calcDisplay" value="0" readonly>'+['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C'].map(x=>'<button onclick="calcKey(\''+x+'\')">'+x+'</button>').join('')+'</div>';
if(id==='settings')return '<div class="settings"><nav class="settings-nav"><h3>⚙ Settings</h3>'+['System','Bluetooth & devices','Network & internet','Personalization','Apps','Accounts','Time & language','Accessibility','Privacy & security','Windows Update'].map(x=>'<button onclick="settingPage(\''+x+'\')">'+x+'</button>').join('')+'</nav><section class="settings-content" id="settingsContent"><h2>System</h2><p>Manage your device preferences.</p><div class="setting-card"><b>Display</b><p>Brightness, night light, scale and layout</p></div><div class="setting-card"><b>Sound</b><p>Volume, output, input devices</p></div><div class="setting-card"><b>Notifications</b><p>Alerts from apps and system</p></div><div class="setting-card"><b>About</b><p>DaniOS Web Desktop · Version 1.0</p></div></section></div>';
if(id==='browser')return '<div class="browser"><div class="browser-bar"><button onclick="history.back()">←</button><button onclick="history.forward()">→</button><input id="browserUrl" value="https://example.com" aria-label="Address"><button onclick="navigateBrowser()">Go</button></div><iframe id="browserFrame" src="https://example.com" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe></div>';
if(id==='terminal')return '<div class="terminal" id="terminal"><div> DaniOS Terminal [Version 1.0]<br>Type "help" to see available commands.<br><br></div><span>PS C:\Users\DaniOS&gt; </span><input id="terminalInput" autocomplete="off"></div>';
if(id==='recycle')return '<div style="padding:28px;color:#475569">The Recycle Bin is empty.</div>';
return '<div style="padding:24px">Search apps, settings, and files<br><input placeholder="Type to search" style="padding:10px;margin-top:14px;width:90%"></div>'}
function openApp(id){$('#startPanel').hidden=true;let existing=document.querySelector('.window[data-app="'+id+'"]');if(existing){focusWin(existing);return}let title=(apps.find(a=>a[0]===id)||[id,'🖥',id])[2],w=document.createElement('section');w.className='window focused';w.dataset.app=id;w.style.zIndex=++z;w.style.left=(12+Math.random()*15)+'%';w.style.top=(8+Math.random()*10)+'%';w.innerHTML='<header class="titlebar"><div class="window-title"><span>'+(apps.find(a=>a[0]===id)||['','🖥'])[1]+'</span>'+title+'</div><div class="win-controls"><button data-action="min">—</button><button data-action="max">□</button><button class="close" data-action="close">×</button></div></header><div class="window-body">'+appContent(id)+'</div>';desktop.append(w);makeDraggable(w);focusWin(w);renderTaskbar();if(id==='terminal')$('#terminalInput').focus()}
function focusWin(w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('focused'));w.classList.add('focused');w.style.zIndex=++z;activeApp=w.dataset.app;renderTaskbar()}
function renderTaskbar(){document.querySelectorAll('.task-btn[data-app]').forEach(b=>{let open=!!document.querySelector('.window[data-app="'+b.dataset.app+'"]');b.classList.toggle('running',open)})}
function makeDraggable(w){let bar=w.querySelector('.titlebar'),sx,sy,ox,oy;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;focusWin(w);sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;bar.setPointerCapture(e.pointerId);bar.onpointermove=ev=>{w.style.left=Math.max(0,ox+ev.clientX-sx)+'px';w.style.top=Math.max(0,oy+ev.clientY-sy)+'px'};bar.onpointerup=()=>bar.onpointermove=null})}
desktop.addEventListener('click',e=>{let a=e.target.closest('[data-app]');if(a){if(a.dataset.app==='search'){showStart();$('#startSearch').focus()}else openApp(a.dataset.app);return}let action=e.target.dataset.action;if(action){let w=e.target.closest('.window');if(action==='close')w.remove();if(action==='min')w.style.display='none';if(action==='max'){w.dataset.max=w.dataset.max==='1'?'0':'1';Object.assign(w.style,w.dataset.max==='1'?{left:'0',top:'0',width:'100%',height:'calc(100% - 54px)',borderRadius:'0'}:{left:'15%',top:'10%',width:'min(760px,85vw)',height:'min(520px,75vh)',borderRadius:'10px'})}renderTaskbar()}let w=e.target.closest('.window');if(w)focusWin(w)});
$('#startBtn').onclick=showStart;$('#powerBtn').onclick=()=>{ $('#startPanel').hidden=true;toast('Power options: Lock · Sleep · Shut down')};
$('#startSearch').addEventListener('input',e=>{$('#appGrid').innerHTML=apps.filter(a=>a[2].toLowerCase().includes(e.target.value.toLowerCase())).map(a=>'<button class="app-tile" data-app="'+a[0]+'"><b>'+a[1]+'</b>'+a[2]+'</button>').join('')});
function calcKey(k){let d=$('#calcDisplay');if(!d)return;if(k==='C'){d.value='0';return}if(k==='='){try{d.value=String(Function('return '+d.value.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))())}catch{d.value='Error'}return}d.value=d.value==='0'?k:d.value+k}
function settingPage(p){$('#settingsContent').innerHTML='<h2>'+p+'</h2><p>Configure '+p.toLowerCase()+' preferences.</p>'+['Options','Device preferences','Advanced settings'].map(x=>'<div class="setting-card"><b>'+x+'</b><p>Manage '+x.toLowerCase()+' for this device.</p><label><input type="checkbox"> Enable</label></div>').join('')}
function navigateBrowser(){let u=$('#browserUrl').value;if(!/^https?:\/\//i.test(u))u='https://'+u;$('#browserFrame').src=u}
desktop.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#startPanel').hidden=true;document.querySelector('.context')?.remove()}if(e.key==='Enter'&&e.target.id==='terminalInput'){let input=e.target,cmd=input.value.trim(),term=$('#terminal');let out={help:'Available: help, date, whoami, clear, ver, apps',date:new Date().toString(),whoami:'DaniOS User',ver:'DaniOS Web Desktop 1.0',apps:apps.map(a=>a[2]).join(', ')};if(cmd==='clear'){term.innerHTML='';}else{let line=document.createElement('div');line.textContent='PS C:\\Users\\DaniOS> '+cmd+'\n'+(out[cmd]|| (cmd?'Command not found: '+cmd:''));term.insertBefore(line,input.parentElement);input.value=''}term.scrollTop=term.scrollHeight}});
desktop.addEventListener('contextmenu',e=>{if(e.target.closest('.window'))return;e.preventDefault();document.querySelector('.context')?.remove();let m=document.createElement('div');m.className='context';m.style.left=Math.min(e.clientX,innerWidth-205)+'px';m.style.top=Math.min(e.clientY,innerHeight-210)+'px';m.innerHTML='<button onclick="openApp(\'explorer\')">📁 Open File Explorer</button><button onclick="openApp(\'settings\')">⚙ Personalize</button><button onclick="toast(\'Desktop icons refreshed\')">↻ Refresh</button><button onclick="toast(\'Display settings opened\');openApp(\'settings\')">▣ Display settings</button>';desktop.append(m);document.addEventListener('click',()=>m.remove(),{once:true})});
function tick(){let d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'<br>'+d.toLocaleDateString()}tick();setInterval(tick,1000);
document.querySelectorAll('.desk-icon').forEach(b=>b.addEventListener('dblclick',()=>openApp(b.dataset.app)));
</script></body></html>
