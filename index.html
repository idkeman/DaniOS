<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="description" content="DaniOS — a browser-based desktop environment"><link rel="manifest" href="./manifest.webmanifest"><title>DaniOS — Web Desktop</title>
<style>
:root{font:14px "Segoe UI",system-ui,sans-serif;color:#172033;background:#101827;--accent:#4f9cf9;--glass:#111c2bdc;--surface:#f7f9fc}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.desktop{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 45%,#176c9c 0,#123c69 30%,transparent 57%),radial-gradient(ellipse at 25% 80%,#443c91 0,transparent 48%),linear-gradient(135deg,#071526,#102e4b 55%,#071525);background-size:cover;background-position:center}.desktop:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#02061766 100%);pointer-events:none}.desktop-icons{position:absolute;inset:12px auto 65px 12px;display:grid;grid-auto-rows:84px;grid-template-columns:82px;gap:4px;align-content:start;z-index:1}.desk-icon{width:78px;border:1px solid transparent;border-radius:7px;background:transparent;color:white;text-shadow:0 1px 3px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}.desk-icon:hover,.desk-icon.selected{background:#ffffff25;border-color:#ffffff35}.desk-icon .glyph{font-size:30px}.taskbar{position:absolute;z-index:10000;bottom:0;left:0;right:0;height:54px;background:var(--glass);backdrop-filter:blur(24px);border-top:1px solid #ffffff24;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;color:white}.task-apps{display:flex;gap:4px}.task-btn{height:42px;min-width:42px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:white;font-size:21px;position:relative}.task-btn:hover,.task-btn.active{background:#ffffff20}.task-btn.running:after{content:"";position:absolute;bottom:2px;left:35%;width:30%;height:3px;border-radius:3px;background:var(--accent)}.tray{position:absolute;right:14px;display:flex;align-items:center;gap:12px;font-size:12px}.tray button{background:none;border:0;color:white;padding:7px;border-radius:5px}.tray button:hover{background:#ffffff20}.start-panel,.flyout{position:absolute;z-index:9999;bottom:62px;background:#172333ef;backdrop-filter:blur(28px);border:1px solid #ffffff25;box-shadow:0 18px 60px #0008;border-radius:12px;color:white}.start-panel{width:min(620px,calc(100vw - 24px));left:50%;transform:translateX(-50%);padding:20px}.start-search{width:100%;padding:12px;border-radius:7px;border:1px solid #7dd3fc66;background:#0c1725;color:white;outline:none}.start-heading{font-size:13px;font-weight:600;margin:18px 0 10px}.app-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.app-tile{border:0;background:transparent;color:white;border-radius:8px;padding:12px 4px;font-size:12px}.app-tile:hover{background:#ffffff18}.app-tile b{display:block;font-size:26px;margin-bottom:6px;font-weight:400}.start-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff20;margin:18px -20px -20px;padding:12px 20px}.window{position:absolute;z-index:10;left:14%;top:9%;width:min(820px,88vw);height:min(570px,78vh);min-width:300px;min-height:210px;background:var(--surface);color:#172033;border:1px solid #ffffff66;border-radius:10px;box-shadow:0 20px 70px #0008;overflow:hidden;display:flex;flex-direction:column;resize:both}.window.focused{outline:1px solid #ffffff50}.titlebar{height:40px;flex-shrink:0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;padding-left:14px;user-select:none;cursor:move;border-bottom:1px solid #dbe1e9}.window-title{font-size:13px;display:flex;gap:9px;align-items:center}.win-controls{display:flex;height:100%}.win-controls button{width:44px;border:0;background:transparent;color:#334155}.win-controls button:hover{background:#e2e8f0}.win-controls .close:hover{background:#dc2626;color:white}.window-body{flex:1;overflow:auto;background:white;min-height:0}.toolbar{height:46px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 12px;gap:8px}.soft-btn,.toolbar button{border:0;background:#eef2f7;border-radius:5px;padding:7px 10px;color:#253247}.toolbar input{flex:1;min-width:80px;background:#f1f5f9;border:0;border-radius:5px;padding:8px}.file-layout{display:flex;height:calc(100% - 46px)}.file-side{width:170px;flex-shrink:0;border-right:1px solid #e5e7eb;padding:10px;color:#475569}.file-side button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px;border-radius:5px;color:inherit}.file-side button:hover,.file-side button.active{background:#e7f1ff}.file-items{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));align-content:start;gap:8px;flex:1}.file-item{text-align:center;padding:12px 5px;border-radius:6px;font-size:12px;overflow-wrap:anywhere}.file-item:hover{background:#eff6ff}.file-item span{display:block;font-size:30px;margin-bottom:7px}.notepad{width:100%;height:100%;border:0;resize:none;outline:0;padding:16px;font:14px/1.6 Consolas,monospace;color:#1e293b}.settings{display:flex;height:100%;background:#f8fafc}.settings-nav{width:190px;flex-shrink:0;padding:16px;background:#f1f5f9;overflow:auto}.settings-nav button{display:block;width:100%;text-align:left;padding:9px;border:0;border-radius:6px;background:transparent;color:#334155}.settings-nav button:hover,.settings-nav button.active{background:#e2e8f0}.settings-content{padding:24px;flex:1;overflow:auto}.settings-content h2{font-weight:500}.setting-card{padding:14px;border:1px solid #e2e8f0;border-radius:8px;margin:10px 0}.setting-card p{color:#64748b;margin:6px 0}.calc{padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc input{grid-column:span 4;text-align:right;padding:14px;font-size:25px;border:1px solid #cbd5e1;border-radius:7px}.calc button{padding:13px;border:0;border-radius:6px;background:#e8edf4}.terminal{height:100%;background:#0b1220;color:#d1fae5;padding:15px;font:13px/1.7 Consolas,monospace;overflow:auto}.terminal input{background:transparent;border:0;outline:0;color:white;font:inherit;width:75%}.browser{height:100%;display:flex;flex-direction:column}.browser-bar{padding:8px;display:flex;gap:6px;background:#eef2f7}.browser-bar input{flex:1;min-width:50px;padding:8px;border:1px solid #cbd5e1;border-radius:5px}.browser iframe{flex:1;border:0;width:100%}.context{position:absolute;z-index:20000;min-width:190px;background:#172333f2;border:1px solid #ffffff25;border-radius:8px;padding:5px;box-shadow:0 12px 40px #0008}.context button{display:block;width:100%;padding:9px 12px;text-align:left;color:white;background:transparent;border:0;border-radius:5px}.context button:hover{background:#ffffff20}.toast{position:absolute;right:18px;bottom:68px;background:#172333ed;color:white;padding:12px 16px;border-radius:8px;z-index:30000;box-shadow:0 8px 30px #0006;max-width:min(360px,90vw)}.flyout{right:12px;width:310px;padding:16px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-grid button,.flyout button{border:1px solid #ffffff20;border-radius:8px;background:#ffffff12;color:white;padding:12px}.flyout p{color:#cbd5e1}.hidden{display:none!important}.lockscreen{position:absolute;inset:0;z-index:50000;background:linear-gradient(130deg,#071526,#17466a);display:grid;place-content:center;text-align:center;color:white}.lockscreen h1{font-size:52px;font-weight:300;margin:0}.lockscreen button{margin:20px auto;padding:10px 24px;border:0;border-radius:6px;background:white;color:#172033}.modal{position:absolute;z-index:40000;inset:0;background:#02061788;display:grid;place-items:center}.modal>div{background:white;padding:22px;border-radius:10px;max-width:420px;color:#172033}@media(max-width:650px){.app-grid{grid-template-columns:repeat(3,1fr)}.window{left:2%!important;top:3%!important;width:96vw!important;height:86vh!important;resize:none}.file-side{width:115px}.taskbar{justify-content:flex-start}.task-apps{margin:auto}.tray{right:5px;gap:2px}.tray .optional{display:none}}
</style></head>
<body><main class="desktop" id="desktop">
<div class="desktop-icons" id="desktopIcons"></div>
<div class="taskbar"><div class="task-apps"><button class="task-btn" id="startBtn" title="Start" aria-label="Start">⊞</button><button class="task-btn" id="searchBtn" title="Search" aria-label="Search">⌕</button><button class="task-btn" id="desktopBtn" title="Virtual desktops" aria-label="Virtual desktops">▦</button><button class="task-btn" data-app="explorer" title="File Explorer">📁</button><button class="task-btn" data-app="browser" title="Browser">🌐</button><button class="task-btn" data-app="notepad" title="Notepad">📝</button><button class="task-btn" data-app="settings" title="Settings">⚙️</button></div><div class="tray"><button id="wifiBtn" title="Quick settings">◉</button><button id="soundBtn" title="Sound">🔊</button><button id="notifyBtn" title="Notifications">▣</button><span id="clock"></span></div></div>
<div class="start-panel hidden" id="startPanel"><input class="start-search" id="startSearch" placeholder="Search apps, settings and files"><div class="start-heading">Pinned</div><div class="app-grid" id="appGrid"></div><div class="start-footer"><span>👤 DaniOS User</span><button class="soft-btn" id="lockBtn">Lock</button><button class="soft-btn" id="powerBtn">⏻ Power</button></div></div>
<div class="flyout hidden" id="desktopPanel"><b>Virtual desktops</b><div id="desktopChoices" class="quick-grid" style="margin:12px 0"></div><button id="newDesktop">＋ New desktop</button></div><div class="flyout hidden" id="quickPanel"><b>Quick settings</b><div class="quick-grid" style="margin-top:12px"><button data-toggle="wifi">◉ Wi-Fi</button><button data-toggle="bluetooth">ᛒ Bluetooth</button><button data-toggle="airplane">✈ Airplane mode</button><button data-toggle="focus">☾ Focus</button></div><p>Volume <input id="volume" type="range" min="0" max="100" value="70"></p><p>Brightness <input id="brightness" type="range" min="35" max="120" value="100"></p><button id="quickSettings">All settings</button></div>
<div class="flyout hidden" id="notifyPanel"><b>Notifications</b><p id="notifications">You're all caught up.</p><button id="clearNotifications">Clear all</button></div>
<div class="lockscreen hidden" id="lockscreen"><div><h1 id="lockTime"></h1><p>DaniOS User</p><button id="unlockBtn">Sign in</button></div></div>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), desktop=$('#desktop'), DB='danios-v2', STORE='files';
const apps=[['explorer','📁','File Explorer'],['browser','🌐','Browser'],['notepad','📝','Notepad'],['calculator','🧮','Calculator'],['settings','⚙️','Settings'],['terminal','⌨️','Terminal'],['photos','🖼️','Photos'],['paint','🎨','Paint'],['calendar','📅','Calendar'],['clockapp','⏰','Clock'],['media','🎵','Media Player'],['tasks','☑️','Task Manager'],['about','💻','About DaniOS']];
let z=30,calc='0',calcOp='',calcFirst=null,calcReset=false,notifications=[],currentFolder='/',db=null,wallpaper='',theme='light',virtualDesktops=['Desktop 1'],currentDesktop=0;
const seed=[['/Documents','folder'],['/Downloads','folder'],['/Pictures','folder'],['/Music','folder'],['/Videos','folder'],['/Desktop','folder'],['/Documents/Welcome.txt','file','Welcome to DaniOS!\n\nThis is your browser-based desktop. Your files are stored in this browser profile.\n\nTip: Open Settings to personalize your desktop.'],['/Documents/Ideas.txt','file','Your ideas go here.'],['/Desktop/Read me.txt','file','Welcome! Double-click apps and files to open them.']];
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;desktop.append(t);setTimeout(()=>t.remove(),3200);notifications.unshift({msg,time:new Date().toLocaleTimeString()});}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return}const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'path'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function allFiles(){if(!db)return seed.map(([path,type,content])=>({path,type,content}));return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putFile(file){if(!db)return;return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(file);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function removeFile(path){if(!db)return;return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(path);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function appIcon(id){return apps.find(a=>a[0]===id)?.[1]||'🖥️'}
function openApp(id){$('#startPanel').classList.add('hidden');$('#quickPanel').classList.add('hidden');$('#notifyPanel').classList.add('hidden');let w=document.querySelector('.window[data-app="'+id+'"][data-desktop="'+currentDesktop+'"]');if(w){w.classList.remove('minimized');focus(w);return}const a=apps.find(x=>x[0]===id)||[id,'🖥️',id],el=document.createElement('section');el.className='window';el.dataset.app=id;el.dataset.desktop=currentDesktop;el.style.zIndex=++z;el.style.left=(9+Math.random()*13)+'%';el.style.top=(7+Math.random()*9)+'%';el.innerHTML='<header class="titlebar"><div class="window-title"><span>'+a[1]+'</span>'+a[2]+'</div><div class="win-controls"><button data-action="min" aria-label="Minimize">—</button><button data-action="max" aria-label="Maximize">□</button><button class="close" data-action="close" aria-label="Close">×</button></div></header><div class="window-body">'+contentFor(id)+'</div>';desktop.append(el);drag(el);focus(el);taskbar();if(id==='terminal')el.querySelector('input')?.focus();if(id==='explorer')renderFiles(el);if(id==='settings')settingsPage('System');if(id==='paint')initPaint(el);if(id==='tasks')renderTasks(el);if(id==='calendar'){const d=el.querySelector('.calendar-date');d.value=new Date().toISOString().slice(0,10);el.querySelector('.calendar-today').textContent=new Date().toLocaleDateString(undefined,{dateStyle:'full'});d.addEventListener('change',()=>{el.querySelector('textarea').value=localStorage.getItem('danios-calendar-'+d.value)||''})}}
function contentFor(id){if(id==='explorer')return '<div class="toolbar"><button data-nav="back">←</button><button data-nav="up">↑</button><input class="folder-path" value="/" aria-label="Folder path"><button data-file="newfolder">＋ Folder</button><button data-file="upload">↑ Upload</button><input class="upload-input hidden" type="file" multiple></div><div class="file-layout"><aside class="file-side">'+['/','/Desktop','/Documents','/Downloads','/Pictures','/Music','/Videos'].map(p=>'<button data-folder="'+p+'">'+(p==='/'?'🏠 Home':'📁 '+p.slice(1))+'</button>').join('')+'</aside><div class="file-items"></div></div>';
if(id==='notepad')return '<div class="toolbar"><button data-note="new">New</button><button data-note="save">Save</button><button data-note="open">Open</button><span class="note-status">Untitled</span></div><textarea class="notepad" placeholder="Start typing..."></textarea>';
if(id==='calculator')return '<div class="calc"><input class="calc-display" value="0" readonly>'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(x=>'<button data-calc="'+x+'">'+x+'</button>').join('')+'</div>';
if(id==='settings')return '<div class="settings"><nav class="settings-nav"><h3>⚙ Settings</h3>'+['System','Bluetooth & devices','Network & internet','Personalization','Apps','Accounts','Time & language','Gaming','Accessibility','Privacy & security','Windows Update','Storage','About'].map((x,i)=>'<button data-setting="'+x+'" class="'+(!i?'active':'')+'">'+x+'</button>').join('')+'</nav><section class="settings-content" id="settingsContent"></section></div>';
if(id==='browser')return '<div class="browser"><div class="browser-bar"><button data-browser="back">←</button><button data-browser="forward">→</button><button data-browser="home">⌂</button><input class="browser-url" value="https://example.com" aria-label="Address"><button data-browser="go">Go</button></div><div class="browser-tabs"><button data-tab="new">＋ New tab</button><span>Sites may block embedding; open externally if a page does not load.</span></div><iframe class="browser-frame" title="Web browser" src="https://example.com" sandbox="allow-forms allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><div class="browser-foot"><button data-browser="external">Open in system browser ↗</button></div></div>';
if(id==='terminal')return '<div class="terminal"><div>DaniOS Terminal [Version 2.0]<br>Virtual shell — commands affect DaniOS files only.<br>Type "help" for commands.<br><br></div><div class="terminal-prompt">PS DaniOS&gt; <input autocomplete="off" spellcheck="false"></div></div>';
if(id==='recycle')return '<div style="padding:24px">Recycle Bin is empty. Deleted DaniOS virtual files are permanently removed in this version.</div>';
if(id==='photos')return '<div style="padding:22px"><h2>Photos</h2><p>Open image files from File Explorer or upload them there.</p><input type="file" accept="image/*" data-photo><div class="photo-preview"></div></div>';
if(id==='paint')return '<div class="toolbar"><button data-paint="clear">Clear</button><label>Color <input type="color" class="paint-color" value="#2563eb"></label><label>Size <input type="range" class="paint-size" min="1" max="30" value="5"></label><button data-paint="save">Save PNG</button></div><canvas class="paint-canvas" style="width:100%;height:calc(100% - 48px);touch-action:none"></canvas>';
if(id==='calendar')return '<div style="padding:24px"><h2>Calendar</h2><input type="date" class="calendar-date"><p class="calendar-today"></p><textarea placeholder="Notes for this date" style="width:100%;height:180px;padding:12px"></textarea><button class="soft-btn" data-calendar="save">Save note</button></div>';
if(id==='clockapp')return '<div style="padding:24px"><h2 class="live-clock" style="font-size:44px;font-weight:300"></h2><p>'+new Date().toLocaleDateString(undefined,{dateStyle:'full'})+'</p><button class="soft-btn" data-clock="timer">Start 1 minute timer</button><p class="timer-status"></p></div>';
if(id==='media')return '<div style="padding:24px"><h2>Media Player</h2><input type="file" accept="audio/*,video/*" data-media><video controls style="width:100%;max-height:300px" class="media-view"></video><audio controls class="audio-view" style="width:100%"></audio></div>';
if(id==='tasks')return '<div style="padding:22px"><h2>Task Manager</h2><div class="task-list"></div></div>';
if(id==='about')return '<div style="padding:28px"><h1>DaniOS</h1><p>Browser-based desktop environment · Version 2.0</p><p>Built with HTML, CSS and JavaScript. It simulates a desktop shell; it is not a native operating system.</p><p>Files are stored locally in this browser profile.</p></div>';
return '<div style="padding:24px">App not found.</div>'}
function focus(w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('focused'));w.classList.add('focused');w.style.zIndex=++z;taskbar()}
function taskbar(){document.querySelectorAll('.task-btn[data-app]').forEach(b=>{b.classList.toggle('running',!!document.querySelector('.window[data-app="'+b.dataset.app+'"]'))})}
function drag(w){const bar=w.querySelector('.titlebar');let x,y,l,t;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;focus(w);if(w.dataset.max==='1')return;x=e.clientX;y=e.clientY;l=w.offsetLeft;t=w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!bar.hasPointerCapture(e.pointerId)||w.dataset.max==='1')return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,l+e.clientX-x))+'px';w.style.top=Math.max(0,Math.min(innerHeight-70,t+e.clientY-y))+'px'});bar.addEventListener('pointerup',e=>{if(bar.hasPointerCapture(e.pointerId))bar.releasePointerCapture(e.pointerId)})}
async function renderFiles(w){const items=w.querySelector('.file-items'),files=await allFiles(),folder=w.querySelector('.folder-path').value||'/';currentFolder=folder;items.innerHTML='';files.filter(f=>{const parent=f.path.substring(0,f.path.lastIndexOf('/'))||'/';return parent===folder}).forEach(f=>{const b=document.createElement('button');b.className='file-item';b.innerHTML='<span>'+(f.type==='folder'?'📁':iconFor(f.path))+'</span>'+esc(f.path.split('/').pop());b.addEventListener('dblclick',()=>{if(f.type==='folder'){w.querySelector('.folder-path').value=f.path;renderFiles(w)}else openTextFile(f)});b.addEventListener('contextmenu',e=>{e.preventDefault();if(confirm('Delete '+f.path+'?'))removeFile(f.path).then(()=>renderFiles(w))});items.append(b)});w.querySelectorAll('[data-folder]').forEach(b=>b.classList.toggle('active',b.dataset.folder===folder))}
function iconFor(p){return /\.(png|jpg|jpeg|gif|webp)$/i.test(p)?'🖼️':/\.(mp3|wav|ogg)$/i.test(p)?'🎵':/\.(mp4|webm)$/i.test(p)?'🎞️':'📄'}
async function openTextFile(f){if(f.blob&&f.content==null){const u=URL.createObjectURL(f.blob);if((f.mime||'').startsWith('image/')){const p=document.querySelector('.window[data-app="photos"]')||null;if(!p)openApp('photos');const w=document.querySelector('.window[data-app="photos"]');w.querySelector('.photo-preview').innerHTML='<img alt="'+esc(f.path)+'" style="max-width:100%;max-height:320px" src="'+u+'">';focus(w);return}if((f.mime||'').startsWith('audio/')||(f.mime||'').startsWith('video/')){if(!document.querySelector('.window[data-app="media"]'))openApp('media');const w=document.querySelector('.window[data-app="media"]');const el=f.mime.startsWith('video/')?w.querySelector('video'):w.querySelector('audio');el.src=u;focus(w);return}const a=document.createElement('a');a.href=u;a.download=f.path.split('/').pop();a.click();return}if(!document.querySelector('.window[data-app="notepad"]'))openApp('notepad');const n=document.querySelector('.window[data-app="notepad"]');n.querySelector('textarea').value=f.content||'';n.querySelector('.note-status').textContent=f.path;n.dataset.filepath=f.path;focus(n)}

function initPaint(w){const canvas=w.querySelector('canvas');const resize=()=>{const r=canvas.getBoundingClientRect(),old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));const ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);if(old.width)ctx.drawImage(old,0,0,old.width/devicePixelRatio,old.height/devicePixelRatio)};requestAnimationFrame(resize);let drawing=false;canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect(),ctx=canvas.getContext('2d');ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const r=canvas.getBoundingClientRect(),ctx=canvas.getContext('2d');ctx.strokeStyle=w.querySelector('.paint-color').value;ctx.lineWidth=Number(w.querySelector('.paint-size').value);ctx.lineCap='round';ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);new ResizeObserver(resize).observe(canvas)}

function safeCalc(a,b,op){if(op==='+')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return b}
function handleCalc(w,k){const d=w.querySelector('.calc-display');if(k==='AC'){calc='0';calcFirst=null;calcOp='';calcReset=false}else if(k==='⌫'){calc=calc.length>1?calc.slice(0,-1):'0'}else if(k==='±'){calc=String(-Number(calc))}else if(k==='%'){calc=String(Number(calc)/100)}else if(['+','−','×','÷'].includes(k)){calcFirst=Number(calc);calcOp=k;calcReset=true}else if(k==='='){if(calcOp&&calcFirst!==null){calc=String(safeCalc(calcFirst,Number(calc),calcOp));calcOp='';calcFirst=null;calcReset=true}}else if(k==='.'){if(calcReset){calc='0.';calcReset=false}else if(!calc.includes('.'))calc+='.'}else{calc=calc==='0'||calcReset?k:calc+k;calcReset=false}d.value=calc}
function renderDesktopChoices(){const box=$('#desktopChoices');box.innerHTML='';virtualDesktops.forEach((name,i)=>{const b=document.createElement('button');b.textContent=(i===currentDesktop?'✓ ':'')+name;b.addEventListener('click',()=>{switchDesktop(i);$('#desktopPanel').classList.add('hidden')});box.append(b)})}function addDesktop(){virtualDesktops.push('Desktop '+(virtualDesktops.length+1));switchDesktop(virtualDesktops.length-1);renderDesktopChoices();toast('Created '+virtualDesktops[currentDesktop])}
